# Limiares do script de demonstração do ByteTrack original (track_thresh 0,5; um rastro novo só nasce
# acima de track_thresh + 0,1). Com os 0,25 padrão do Ultralytics, detecções fracas de prateleiras
# viravam IDs de pessoa.
tracker_type: bytetrack
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 30
match_thresh: 0.8
fuse_score: true
